# .github/workflows/greetings.yml
name: Greet New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "Thanks for opening your first issue. A maintainer will review it when available."
        pr_message: "Thanks for opening your first pull request. A maintainer will review it when available."
